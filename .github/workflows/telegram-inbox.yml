name: Sync Telegram INBOX topic

on:
  schedule:
    # Daily at 07:00 UTC. Adjust to taste; cron is always UTC.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-inbox
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch new INBOX-topic messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_INBOX_THREAD_ID: ${{ secrets.TELEGRAM_INBOX_THREAD_ID }}
        run: python scripts/telegram_inbox.py

      - name: Commit changes
        run: |
          git config user.name "telegram-inbox-bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git add INBOX.md .github/telegram-state.json
          git commit -m "chore: sync Telegram INBOX topic"
          git push
